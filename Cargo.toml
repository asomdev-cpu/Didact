[package]
name = "didact"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "didact"
path = "src/main.rs"

[dependencies]
# Dessin vectoriel de la scène (formes, anticrénelage, export PNG)
tiny-skia = "0.12"
# Fenêtre + contrôles (pause, barre de lecture)
eframe = "0.37"
# Composition du texte et du LaTeX : LaTeX → Typst (mitex), composé par Typst, exporté en SVG
typst = "0.15"
typst-layout = "0.15"
typst-svg = "0.15"
mitex = "0.2"
# Lecture du SVG produit par Typst (contours des lettres et traits)
usvg = "0.49"
