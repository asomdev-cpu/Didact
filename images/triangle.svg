  <polygon points="70,240 330,240 330,70" fill="#1E3A8A" fill-opacity="0.55" stroke="#60A5FA" stroke-width="5" stroke-linejoin="round"/>
  <path d="M305 240 V215 H330" fill="none" stroke="#60A5FA" stroke-width="3"/>
  <text x="200" y="275" font-size="30" fill="#F9FAFB" text-anchor="middle" font-style="italic">a</text>
  <text x="355" y="165" font-size="30" fill="#F9FAFB" text-anchor="middle" font-style="italic">b</text>
  <text x="180" y="140" font-size="30" fill="#FBBF24" text-anchor="middle" font-style="italic">c</text>
  <text x="200" y="40" font-size="26" fill="#9CA3AF" text-anchor="middle">a² + b² = c²</text>
