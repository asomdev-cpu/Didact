<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Schéma « importé » : un triangle rectangle et ses côtés, comme dessiné dans Inkscape -->
